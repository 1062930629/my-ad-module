apply plugin: 'com.android.application'
android {
    namespace 'com.my.admodule'
    compileSdk 33
    defaultConfig {
        applicationId "com.my.admodule"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
